name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;25.1.8937393 platforms;android-34 build-tools;34.0.0 cmake;3.22.1'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build ARM64 Debug APK
        run: ./gradlew assembleAfatDebug -Pabi=arm64-v8a
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: betakama-debug
          path: TMessagesProj/build/outputs/apk/**/*.apk
